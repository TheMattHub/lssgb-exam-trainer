<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>Value stream map with timeline</title>
<desc>Four process boxes with cycle times and inventory triangles between them, a timeline ladder of waiting versus processing time, and the lead time and process cycle efficiency calculation.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="640" height="430" fill="#ffffff"/>
<text x="16.0" y="24.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937">Mini value stream: one welded frame</text>
<rect x="16.0" y="40.0" width="104.0" height="34.0" rx="4" fill="#4353c9" stroke="#4353c9" stroke-width="1.5"/>
<text x="68.0" y="63.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">Cut</text>
<rect x="16.0" y="74.0" width="104.0" height="50.0" rx="0" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="26.0" y="95.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">C/T 4 min</text>
<text x="26.0" y="115.0" font-size="14" text-anchor="start" font-weight="normal" fill="#6b7280">1 operator</text>
<rect x="184.0" y="40.0" width="104.0" height="34.0" rx="4" fill="#4353c9" stroke="#4353c9" stroke-width="1.5"/>
<text x="236.0" y="63.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">Weld</text>
<rect x="184.0" y="74.0" width="104.0" height="50.0" rx="0" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="194.0" y="95.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">C/T 6 min</text>
<text x="194.0" y="115.0" font-size="14" text-anchor="start" font-weight="normal" fill="#6b7280">1 operator</text>
<rect x="352.0" y="40.0" width="104.0" height="34.0" rx="4" fill="#4353c9" stroke="#4353c9" stroke-width="1.5"/>
<text x="404.0" y="63.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">Paint</text>
<rect x="352.0" y="74.0" width="104.0" height="50.0" rx="0" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="362.0" y="95.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">C/T 10 min</text>
<text x="362.0" y="115.0" font-size="14" text-anchor="start" font-weight="normal" fill="#6b7280">1 operator</text>
<rect x="520.0" y="40.0" width="104.0" height="34.0" rx="4" fill="#4353c9" stroke="#4353c9" stroke-width="1.5"/>
<text x="572.0" y="63.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">Pack</text>
<rect x="520.0" y="74.0" width="104.0" height="50.0" rx="0" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="530.0" y="95.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">C/T 2 min</text>
<text x="530.0" y="115.0" font-size="14" text-anchor="start" font-weight="normal" fill="#6b7280">1 operator</text>
<path d="M152.0,44 L170.0,74 L134.0,74 Z" stroke="#9a5c00" stroke-width="1.5" fill="#fbf0dc"/>
<text x="152.0" y="69.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#9a5c00">I</text>
<text x="152.0" y="92.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#9a5c00">4 h</text>
<line x1="122.0" y1="110.0" x2="181.0" y2="110.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M320.0,44 L338.0,74 L302.0,74 Z" stroke="#9a5c00" stroke-width="1.5" fill="#fbf0dc"/>
<text x="320.0" y="69.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#9a5c00">I</text>
<text x="320.0" y="92.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#9a5c00">8 h</text>
<line x1="290.0" y1="110.0" x2="349.0" y2="110.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M488.0,44 L506.0,74 L470.0,74 Z" stroke="#9a5c00" stroke-width="1.5" fill="#fbf0dc"/>
<text x="488.0" y="69.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#9a5c00">I</text>
<text x="488.0" y="92.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#9a5c00">6 h</text>
<line x1="458.0" y1="110.0" x2="517.0" y2="110.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="16.0" y="160.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937">Timeline</text>
<line x1="16.0" y1="214.0" x2="120.0" y2="214.0" stroke="#0a8560" stroke-width="3"/>
<text x="68.0" y="236.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0a8560">4 min</text>
<line x1="120.0" y1="214.0" x2="120.0" y2="178.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="120.0" y1="178.0" x2="184.0" y2="178.0" stroke="#c9373f" stroke-width="3"/>
<line x1="184.0" y1="178.0" x2="184.0" y2="214.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="152.0" y="170.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#c9373f">4 h</text>
<line x1="184.0" y1="214.0" x2="288.0" y2="214.0" stroke="#0a8560" stroke-width="3"/>
<text x="236.0" y="236.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0a8560">6 min</text>
<line x1="288.0" y1="214.0" x2="288.0" y2="178.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="288.0" y1="178.0" x2="352.0" y2="178.0" stroke="#c9373f" stroke-width="3"/>
<line x1="352.0" y1="178.0" x2="352.0" y2="214.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="320.0" y="170.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#c9373f">8 h</text>
<line x1="352.0" y1="214.0" x2="456.0" y2="214.0" stroke="#0a8560" stroke-width="3"/>
<text x="404.0" y="236.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0a8560">10 min</text>
<line x1="456.0" y1="214.0" x2="456.0" y2="178.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="456.0" y1="178.0" x2="520.0" y2="178.0" stroke="#c9373f" stroke-width="3"/>
<line x1="520.0" y1="178.0" x2="520.0" y2="214.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="488.0" y="170.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#c9373f">6 h</text>
<line x1="520.0" y1="214.0" x2="624.0" y2="214.0" stroke="#0a8560" stroke-width="3"/>
<text x="572.0" y="236.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0a8560">2 min</text>
<text x="16.0" y="266.0" font-size="14" text-anchor="start" font-weight="normal" fill="#c9373f">Upper steps: waiting = non-value-added (NVA)</text>
<text x="16.0" y="288.0" font-size="14" text-anchor="start" font-weight="normal" fill="#0a8560">Lower steps: processing = value-added (VA)</text>
<rect x="16.0" y="306.0" width="608.0" height="108.0" rx="8" fill="#e6e9fb" stroke="#e6e9fb" stroke-width="1.5"/>
<text x="32.0" y="334.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2937">VA time = 4 + 6 + 10 + 2 = 22 min</text>
<text x="32.0" y="360.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2937">Lead time = 18 h waiting + 22 min = 1,102 min</text>
<text x="32.0" y="392.0" font-size="16" text-anchor="start" font-weight="bold" fill="#4353c9">PCE = VA time ÷ lead time = 22 ÷ 1,102 ≈ 2 %</text>
</svg>
