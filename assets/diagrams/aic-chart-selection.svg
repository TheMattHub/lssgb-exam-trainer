<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>Control chart selection</title>
<desc>Flowchart: continuous data choose by subgroup size (I-MR for 1, Xbar-R for 2 to 9, Xbar-S for 10 or more); attribute data split into defectives (np for constant n, p for varying n) and defects (c for constant area, u for varying area).</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="640" height="470" fill="#ffffff"/>
<rect x="170" y="10" width="300" height="40" rx="6" fill="#e6e9fb" stroke="#4353c9" stroke-width="1.5"/>
<text x="320" y="35.2" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="600">What kind of data is plotted?</text>
<line x1="320" y1="50" x2="320" y2="64" stroke="#6b7280" stroke-width="1.5"/>
<line x1="160" y1="64" x2="480" y2="64" stroke="#6b7280" stroke-width="1.5"/>
<line x1="160" y1="64" x2="160" y2="82" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="480" y1="64" x2="480" y2="82" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="25" y="84" width="270" height="46" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text y="102.8" font-size="15" text-anchor="middle" fill="#1f2937"><tspan x="160" dy="0">Continuous (variables)</tspan><tspan x="160" dy="19">measured: mm, s, kg</tspan></text>
<rect x="335" y="84" width="290" height="46" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text y="102.8" font-size="15" text-anchor="middle" fill="#1f2937"><tspan x="480" dy="0">Attribute (counted)</tspan><tspan x="480" dy="19">good/bad units or defects</tspan></text>
<line x1="160" y1="130" x2="160" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="60" y="152" width="200" height="38" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="160" y="176.2" font-size="15" text-anchor="middle" fill="#1f2937">Subgroup size n?</text>
<line x1="60" y1="190" x2="60" y2="350" stroke="#6b7280" stroke-width="1.5"/>
<line x1="60" y1="226" x2="82" y2="226" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="84" y="202" width="210" height="48" rx="6" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="98" y="232" font-size="15" text-anchor="start" fill="#6b7280">n = 1</text>
<text x="282" y="232" font-size="17" text-anchor="end" fill="#4353c9" font-weight="700">I-MR</text>
<line x1="60" y1="288" x2="82" y2="288" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="84" y="264" width="210" height="48" rx="6" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="98" y="294" font-size="15" text-anchor="start" fill="#6b7280">n = 2 to 9</text>
<text x="282" y="294" font-size="17" text-anchor="end" fill="#4353c9" font-weight="700">Xbar-R</text>
<line x1="60" y1="350" x2="82" y2="350" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="84" y="326" width="210" height="48" rx="6" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="98" y="356" font-size="15" text-anchor="start" fill="#6b7280">n ≥ 10</text>
<text x="282" y="356" font-size="17" text-anchor="end" fill="#4353c9" font-weight="700">Xbar-S</text>
<line x1="400" y1="130" x2="400" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="560" y1="130" x2="560" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="325" y="152" width="150" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text y="173.8" font-size="15" text-anchor="middle" fill="#1f2937"><tspan x="400" dy="0">Defectives</tspan><tspan x="400" dy="19">(bad units)</tspan></text>
<rect x="485" y="152" width="150" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text y="173.8" font-size="15" text-anchor="middle" fill="#1f2937"><tspan x="560" dy="0">Defects</tspan><tspan x="560" dy="19">(flaws counted)</tspan></text>
<line x1="336" y1="204" x2="336" y2="314" stroke="#6b7280" stroke-width="1.5"/>
<line x1="336" y1="252" x2="344" y2="252" stroke="#6b7280" stroke-width="1.5"/>
<rect x="344" y="228" width="131" height="48" rx="6" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="354" y="248" font-size="14" text-anchor="start" fill="#6b7280">Constant n</text>
<text x="354" y="268" font-size="16" text-anchor="start" fill="#4353c9" font-weight="700">np chart</text>
<line x1="336" y1="314" x2="344" y2="314" stroke="#6b7280" stroke-width="1.5"/>
<rect x="344" y="290" width="131" height="48" rx="6" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="354" y="310" font-size="14" text-anchor="start" fill="#6b7280">Varying n</text>
<text x="354" y="330" font-size="16" text-anchor="start" fill="#4353c9" font-weight="700">p chart</text>
<line x1="496" y1="204" x2="496" y2="314" stroke="#6b7280" stroke-width="1.5"/>
<line x1="496" y1="252" x2="504" y2="252" stroke="#6b7280" stroke-width="1.5"/>
<rect x="504" y="228" width="131" height="48" rx="6" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="514" y="248" font-size="14" text-anchor="start" fill="#6b7280">Constant area</text>
<text x="514" y="268" font-size="16" text-anchor="start" fill="#4353c9" font-weight="700">c chart</text>
<line x1="496" y1="314" x2="504" y2="314" stroke="#6b7280" stroke-width="1.5"/>
<rect x="504" y="290" width="131" height="48" rx="6" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="514" y="310" font-size="14" text-anchor="start" fill="#6b7280">Varying area</text>
<text x="514" y="330" font-size="16" text-anchor="start" fill="#4353c9" font-weight="700">u chart</text>
<text x="20" y="412" font-size="14" text-anchor="start" fill="#6b7280">p and u charts also work when n is constant (their limits are then flat).</text>
<text x="20" y="436" font-size="14" text-anchor="start" fill="#6b7280">Small shifts under 1.5σ: CUSUM or EWMA.  Read the R, S or MR chart first.</text>
</svg>
