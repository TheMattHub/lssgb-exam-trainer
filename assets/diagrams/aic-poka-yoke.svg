<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>Control hierarchy and poka-yoke</title>
<desc>Ladder of controls from strongest (eliminate the cause) to weakest (inspection and training), and three poka-yoke methods: contact, fixed-value and motion-step, each with an example.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="640" height="480" fill="#ffffff"/>
<text x="20" y="26" font-size="16" text-anchor="start" fill="#1f2937" font-weight="700">Holding the gain: strongest control first</text>
<rect x="20" y="40" width="540" height="34" rx="6" fill="#e3f4ee" stroke="#0a8560" stroke-width="1.5"/>
<text x="36" y="63" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">1.  Eliminate the cause (design it out)</text>
<rect x="20" y="80" width="490" height="34" rx="6" fill="#e3f4ee" stroke="#0a8560" stroke-width="1.5"/>
<text x="36" y="103" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">2.  Poka-yoke: prevent the error</text>
<rect x="20" y="120" width="440" height="34" rx="6" fill="#e6e9fb" stroke="#4353c9" stroke-width="1.5"/>
<text x="36" y="143" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">3.  Poka-yoke: detect it at once</text>
<rect x="20" y="160" width="390" height="34" rx="6" fill="#e6e9fb" stroke="#4353c9" stroke-width="1.5"/>
<text x="36" y="183" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">4.  SPC chart + response plan</text>
<rect x="20" y="200" width="340" height="34" rx="6" fill="#fbf0dc" stroke="#9a5c00" stroke-width="1.5"/>
<text x="36" y="223" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">5.  Inspection, training, procedures</text>
<text x="596" y="58" font-size="14" text-anchor="middle" fill="#0a8560">stronger</text>
<text x="596" y="238" font-size="14" text-anchor="middle" fill="#9a5c00">weaker</text>
<line x1="596" y1="220" x2="596" y2="68" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="20" y="270" font-size="16" text-anchor="start" fill="#1f2937" font-weight="700">Three poka-yoke methods</text>
<rect x="20" y="284" width="192" height="180" rx="6" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="34" y="310" font-size="17" text-anchor="start" fill="#4353c9" font-weight="700">Contact</text>
<text y="336" font-size="15" text-anchor="start" fill="#1f2937"><tspan x="34" dy="0">Senses shape, size,</tspan><tspan x="34" dy="19">position or colour.</tspan></text>
<text y="392" font-size="14" text-anchor="start" fill="#6b7280"><tspan x="34" dy="0">Example: an offset pin</tspan><tspan x="34" dy="18">lets the bracket fit</tspan><tspan x="34" dy="18">one way only.</tspan></text>
<rect x="224" y="284" width="192" height="180" rx="6" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="238" y="310" font-size="17" text-anchor="start" fill="#4353c9" font-weight="700">Fixed-value</text>
<text y="336" font-size="15" text-anchor="start" fill="#1f2937"><tspan x="238" dy="0">Checks a set number</tspan><tspan x="238" dy="19">of parts or moves.</tspan></text>
<text y="392" font-size="14" text-anchor="start" fill="#6b7280"><tspan x="238" dy="0">Example: a kit tray of</tspan><tspan x="238" dy="18">6 screws; an empty</tspan><tspan x="238" dy="18">pocket shows a miss.</tspan></text>
<rect x="428" y="284" width="192" height="180" rx="6" fill="#ffffff" stroke="#4353c9" stroke-width="1.5"/>
<text x="442" y="310" font-size="17" text-anchor="start" fill="#4353c9" font-weight="700">Motion-step</text>
<text y="336" font-size="15" text-anchor="start" fill="#1f2937"><tspan x="442" dy="0">Checks the steps run</tspan><tspan x="442" dy="19">in the right order.</tspan></text>
<text y="392" font-size="14" text-anchor="start" fill="#6b7280"><tspan x="442" dy="0">Example: the press will</tspan><tspan x="442" dy="18">not cycle until steps</tspan><tspan x="442" dy="18">1 and 2 are sensed.</tspan></text>
</svg>
