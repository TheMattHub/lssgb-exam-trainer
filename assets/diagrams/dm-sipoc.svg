<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>SIPOC example</title>
<desc>SIPOC for supplier invoice handling: suppliers, inputs, five process steps, outputs and customers in five columns.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="640" height="486" fill="#ffffff"/>
