<rect x="512.0" y="120.0" width="112.0" height="44.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="568.0" y="147.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">Vendors</text>
<rect x="512.0" y="186.0" width="112.0" height="44.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="568.0" y="213.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">Controller</text>
<rect x="512.0" y="252.0" width="112.0" height="44.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="568.0" y="279.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">Auditors</text>
<text x="320.0" y="470.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#6b7280">Process column: 4–7 high-level steps. Fill P first, then O, C, I, S.</text>
