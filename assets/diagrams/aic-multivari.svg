<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>Multi-vari chart example</title>
<desc>Shaft diameter measured at three positions on three consecutive pieces at 08:00, 10:00 and 12:00. Positional variation is the spread within a piece, cyclical the change between pieces, temporal the shift between times, which is the largest family in this example.</desc>
