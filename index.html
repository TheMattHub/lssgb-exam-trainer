<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Everything is local: scripts and styles from this folder only, no network, no inline code. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Practise IASSC Lean Six Sigma Green Belt questions and learn from your mistakes.">
  <title>LSSGB Exam Trainer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234353c9'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- Applies the stored theme before first paint (no flash). -->
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">GB</span>LSSGB Exam Trainer</a>
    <nav class="nav" aria-label="Main">
      <a href="#/practice" data-nav="practice">Practice</a>
      <a href="#/mock" data-nav="mock">Mock exam</a>
      <a href="#/learn" data-nav="learn">Learn</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
  </header>
  <p id="notice" class="notice" hidden></p>
  <main id="main" tabindex="-1">
    <noscript><p class="card">This trainer needs JavaScript.</p></noscript>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form method="dialog" class="dialog-body">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
      <div class="row end">
        <button value="cancel" class="btn ghost" id="dialog-cancel">Cancel</button>
        <button value="ok" class="btn" id="dialog-ok">OK</button>
      </div>
    </form>
  </dialog>

  <!-- Data: phases and topics, then the registries the packs add to. -->
  <script src="data/topics.js"></script>
  <script src="js/registry.js"></script>

  <!-- Question packs (one file per pack; an empty or missing pack is fine). -->
  <script src="data/questions/define1.js"></script>
  <script src="data/questions/define2.js"></script>
  <script src="data/questions/measure1.js"></script>
  <script src="data/questions/measure2.js"></script>
  <script src="data/questions/analyze.js"></script>
  <script src="data/questions/improve.js"></script>
  <script src="data/questions/control.js"></script>

  <!-- Learn pages, same packs. -->
  <script src="data/learn/define1.js"></script>
  <script src="data/learn/define2.js"></script>
  <script src="data/learn/measure1.js"></script>
  <script src="data/learn/measure2.js"></script>
  <script src="data/learn/analyze.js"></script>
  <script src="data/learn/improve.js"></script>
  <script src="data/learn/control.js"></script>

  <!-- SAMPLE DATA: remove these two lines (and the two sample.js files) when the real packs are in. -->
  <script src="data/questions/sample.js"></script>
  <script src="data/learn/sample.js"></script>
  <!-- END SAMPLE DATA -->

  <!-- App -->
  <script src="js/dom.js"></script>
  <script src="js/store.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
